name: Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Build Plugins
        run: ./gradlew make makePluginsJson

      - name: Push builds
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: build/plugins
          clean: true
