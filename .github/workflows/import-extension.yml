name: Import Extension

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'URL Repositori Sumber (boleh lengkap dengan /tree/main/)'
        required: true
        type: string
      branch:
        description: 'Cabang Repositori Sumber (kosongkan jika sudah ada di URL)'
        required: false
        default: 'main'
        type: string
      extension_folder:
        description: 'Nama Folder Ekstensi (contoh: Samehadaku)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Shakastream
        uses: actions/checkout@v4

      - name: Parse URL & Clone Extension Folder
        run: |
          RAW_URL="${{ inputs.repo_url }}"
          BRANCH="${{ inputs.branch }}"

          # Jika URL mengandung /tree/<branch>, ekstrak nama branch dan bersihkan URL dasar
          if [[ "$RAW_URL" =~ (https://github\.com/[^/]+/[^/]+)/tree/([^/]+) ]]; then
            CLEAN_URL="${BASH_REMATCH[1]}"
            BRANCH="${BASH_REMATCH[2]}"
          else
            CLEAN_URL=$(echo "$RAW_URL" | sed -E 's|(https://github\.com/[^/]+/[^/]+).*|\1|')
          fi

          echo "Cloning $CLEAN_URL (branch: $BRANCH)..."
          git clone --depth 1 --branch "$BRANCH" "$CLEAN_URL" source_repo

          if [ ! -d "source_repo/${{ inputs.extension_folder }}" ]; then
            echo "Error: Folder '${{ inputs.extension_folder }}' tidak ditemukan di repositori sumber!"
            exit 1
          fi

          rm -rf "${{ inputs.extension_folder }}"
          cp -r "source_repo/${{ inputs.extension_folder }}" "./${{ inputs.extension_folder }}"
          rm -rf source_repo

      - name: Register in settings.gradle.kts (If Manual)
        run: |
          if grep -q 'include(":' settings.gradle.kts; then
            if ! grep -q 'include(":${{ inputs.extension_folder }}")' settings.gradle.kts; then
              echo 'include(":${{ inputs.extension_folder }}")' >> settings.gradle.kts
            fi
          fi

      - name: Commit & Push to Master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.extension_folder }}" settings.gradle.kts
          git diff --staged --quiet && echo "Tidak ada perubahan" && exit 0
          git commit -m "Import extension: ${{ inputs.extension_folder }}"
          git push
          
